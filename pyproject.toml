[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pdf-tools"
dynamic = ["version"]
description = "View, redact, fill, annotate, sign and merge PDFs"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "src/pdf_tools/assets/icons/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pyside6>=6.6",
]

[project.gui-scripts]
pdf-tools = "pdf_tools.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/vamsikalagaturu/pdf-tools"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_tools"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "pdf_tools/AGENTS.md"
"man/pdf-tools.1" = "pdf_tools/pdf-tools.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
