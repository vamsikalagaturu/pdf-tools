name: Native C
on:
  push:
    paths: ["native/**", "tests/test_cli.py", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "tests/test_cli.py", ".github/workflows/native.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MuPDF (headers and library from PyMuPDF), PCRE2, fontconfig, OpenSSL, raylib's X11/Wayland/GL dependencies
        run: |
          python -m pip install "pymupdf==2.0.*" pytest .
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev libfontconfig-dev libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev
      - name: raylib 6.2 and raygui 5.0 (native/thirdparty is not tracked)
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raygui.git native/thirdparty/raygui
          git clone --depth 1 --branch 6.2 https://github.com/raysan5/raylib.git native/thirdparty/raylib
          cmake -S native/thirdparty/raylib -B build/raylib -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release \
            -DGLFW_BUILD_WAYLAND=ON -DGLFW_BUILD_X11=ON -DCMAKE_INSTALL_PREFIX="$PWD/native/thirdparty/raylib-install"
          cmake --build build/raylib --parallel --target install
      - name: Configure (core, CLI, window, tests)
        shell: bash
        run: |
          MUPDF_PREFIX=$(python -c 'import pymupdf,os;print(os.path.dirname(pymupdf.__file__))')
          LIB=$(find "$MUPDF_PREFIX" -maxdepth 1 -name 'libmupdf.so.*' | head -1)
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release \
            "-DMUPDF_INCLUDE_DIR=$MUPDF_PREFIX/mupdf-devel/include" "-DMUPDF_LIBRARY=$LIB" \
            "-Draylib_DIR=$PWD/native/thirdparty/raylib-install/lib/cmake/raylib" \
            "-DPython3_EXECUTABLE=$(command -v python)"
      - name: Build
        run: cmake --build build/native --parallel
      - name: Core tests
        run: ctest --test-dir build/native --output-on-failure
      - name: CLI contract (AGENTS.md) against the C binary
        run: PDF_TOOLS_BIN="$PWD/build/native/pdf-tools-c" python -m pytest -q tests/test_cli.py
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDF Tools.app and PDF-Tools.dmg (native/macos/build.sh, as on a Mac)
        run: PT_MACOS_OUT="$RUNNER_TEMP/pdf-tools-macos" native/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Tools-macOS
          path: ${{ runner.temp }}/pdf-tools-macos/out/PDF-Tools.dmg
